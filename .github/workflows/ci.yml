name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type:check
      - run: pnpm test
      - run: pnpm build

# Playwright E2E is local-only for now (needs the prod build + 3 browser bundles);
# add it as a second job when main gets slow to trust.
